services:
  - type: web
    name: amazon-listing-studio
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MINIMAX_API_KEY
        sync: false
      - key: MINIMAX_API_URL
        value: https://api.minimaxi.com/v1
      - key: MINIMAX_MODEL
        value: MiniMax-M3
      - key: SELLERSPRITE_MCP_URL
        sync: false
